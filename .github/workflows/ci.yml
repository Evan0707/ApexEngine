name: CI

on:
  push:
  pull_request:

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: pipx install clang-format==18.1.3

      - name: Check formatting
        run: git ls-files '*.h' '*.cpp' | xargs -r clang-format --dry-run --Werror

  build:
    name: Build ${{ matrix.preset }}
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-debug, windows-release, windows-profile]
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      # The hosted image lags behind the MSVC 14.52 requirement; remove this step once it ships VS 18.12+.
      - name: Update Visual Studio to MSVC 14.52 or newer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Write-Host "Before: $(& $vswhere -latest -products * -property catalog_productDisplayVersion)"
          $bootstrapper = "$env:RUNNER_TEMP\vs_enterprise.exe"
          Invoke-WebRequest https://aka.ms/vs/18/stable/vs_enterprise.exe -OutFile $bootstrapper
          $process = Start-Process -FilePath $bootstrapper -Wait -PassThru -ArgumentList @(
            'update', '--installPath', "`"$vs`"", '--quiet', '--wait', '--norestart', '--nocache')
          if ($process.ExitCode -notin 0, 3010) {
            throw "Visual Studio update failed with exit code $($process.ExitCode)"
          }
          Write-Host "After: $(& $vswhere -latest -products * -property catalog_productDisplayVersion)"

      - name: Install vcpkg at the manifest baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout $baseline
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure, build, test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}
          ctest --preset ${{ matrix.preset }}
